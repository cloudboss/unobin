name: docs

on:
  workflow_call:
    inputs:
      version:
        description: Version label for this build.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version label for this build.
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: cloudboss/cloudboss-docs/.github/workflows/docs.yml@v0.2.0
    with:
      version: ${{ inputs.version }}
      setup-go: true
      generate: go run ./cmd/hack docs all
